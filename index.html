<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap">
<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a17;--sf:#16251f;--ink:#e6f0ec;--mut:#93a8a1;--ln:#2a3d36;--ac:#4cc3a9;--acs:#1c3a32;--neg:#ff8a80;--negs:#3a1f1c;--warn:#f2c14e;--warns:#3a2f12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a17;--sf:#16251f;--ink:#e6f0ec;--mut:#93a8a1;--ln:#2a3d36;--ac:#4cc3a9;--acs:#1c3a32;--neg:#ff8a80;--negs:#3a1f1c;--warn:#f2c14e;--warns:#3a2f12;color-scheme:dark}

.tg{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--acs);color:var(--ac)}

.tg2 span{display:inline-block;margin:2px 6px 2px 0;padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12.5px}
.bar button,.bar .btn{border-radius:999px;padding:9px 18px;box-shadow:0 4px 12px -6px rgba(15,107,92,.7)}
.bar button.ghost,.bar .btn.ghost{box-shadow:none;background:var(--sf)}
.tabs{gap:6px;padding:5px;background:var(--sf);border:1px solid var(--ln);border-radius:999px;margin-bottom:18px}
.tabs button{border:0;margin:0;border-radius:999px;padding:8px 15px}
.tabs button.on{background:var(--ac);color:var(--sf)}
.card{border-radius:14px;box-shadow:0 1px 2px rgba(15,61,54,.06),0 10px 26px -16px rgba(15,61,54,.35)}

.kpi.n{border-left-color:var(--ln)}
.kpi:before{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--acs);font-size:20px}
.kpi.n:before{background:var(--negs)}
.kpis .kpi:nth-child(1):before{content:"📈"}.kpis .kpi:nth-child(2):before{content:"🧾"}.kpis .kpi:nth-child(3):before{content:"💎"}.kpis .kpi:nth-child(4):before{content:"🏦"}
.kpi b{font-family:"Source Serif 4",Georgia,serif;font-size:22px}
th{background:var(--acs);color:var(--ac);font-weight:600}
tr:nth-child(even) td{background:rgba(15,107,92,.05)}
tr:hover td{background:var(--acs)}
tr.tot td{background:var(--acs)}
tr.flag td{background:var(--negs)!important}
.bars{border-bottom:2px solid var(--ln)}
.bars i{width:26px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#4cc3a9,#0f6b5c)}
.bars i.b{background:linear-gradient(180deg,#e5675d,#b3372f)}
.ins{border-left:4px solid var(--ac);border-radius:8px;padding:12px 14px}
.ins:before{content:"✓  ";font-weight:700;color:var(--ac)}
.ins.w{border-left-color:var(--warn)}.ins.w:before{content:"!  ";color:var(--warn)}
.ins.n{border-left-color:var(--neg)}.ins.n:before{content:"✕  ";color:var(--neg)}
.q{display:table;margin:8px 0 8px auto;padding:6px 13px;border-radius:14px 14px 2px 14px;background:var(--ac);color:var(--sf)}
.a{display:table;max-width:92%;padding:8px 13px;border-radius:14px 14px 14px 2px;background:var(--sf);border:1px solid var(--ln)}

@media (max-width:560px){.hero{padding:18px 14px}.hero:before{display:none}.logo{width:44px;height:44px;font-size:22px}.hero h1{font-size:27px}}
.deck{background:var(--sf);border:1px solid var(--ln);border-radius:16px;overflow:hidden;box-shadow:0 14px 34px -18px rgba(15,61,54,.5)}
.sl{min-height:360px;padding:28px 32px;display:flex;flex-direction:column;gap:6px}
.sl h2{font-size:26px;color:var(--ac);margin-bottom:8px}
.sl ul{margin:0;padding-left:22px;font-size:17px}.sl li{margin:9px 0}
.sl.cv{background:#0f3d36 repeating-linear-gradient(0deg,transparent 0 31px,rgba(76,195,169,.16) 31px 32px);color:#fff;justify-content:center}
.sl.cv h1{color:#fff;font-size:48px}.sl.cv p{color:#b8d8d0;font-size:18px;margin:6px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.flow{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.flow>div{flex:1;min-width:130px;border:1.5px solid var(--ac);border-radius:10px;padding:12px;background:var(--bg);font-size:14px}
.flow b{display:block;font-family:"Source Serif 4",Georgia,serif;font-size:16px;margin-bottom:4px;color:var(--ac)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--ln);color:var(--mut)}
.deck:fullscreen{display:flex;flex-direction:column;border-radius:0}.deck:fullscreen .sl{flex:1;font-size:1.25em;overflow:auto}
@media (max-width:640px){.cols{grid-template-columns:1fr}.sl{padding:20px 16px}.sl.cv h1{font-size:36px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<body>
<div class="wrap">
<div class="hero"><div class="logo">📒</div><div><h1>AkunSmart</h1><p>Catat transaksi, lihat siklus akuntansi otomatis, dan tanya AI analis keuangan.</p><div class="tg2"><span>Jurnal otomatis</span><span>Laporan keuangan</span><span>Deteksi anomali</span><span>Prakiraan laba</span></div></div></div>
<div class="bar">
<button id="demo">Muat data contoh</button>
<label class="btn ghost" style="margin:0;color:var(--ac)">Unggah CSV / Excel<input id="file" type="file" accept=".csv,.xlsx,.xls,text/csv" hidden></label>
<button class="ghost" id="clr">Kosongkan</button>
<span class="sub" style="margin:0;font-size:13px">Format CSV/Excel (baris pertama judul kolom): tanggal, keterangan, akun_debit, akun_kredit, jumlah</span>
</div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
var S={e:[],tab:"ringkasan",chat:[]};
var TABS=[["ringkasan","📊 Ringkasan"],["jurnal","📝 Jurnal Umum"],["buku","📚 Buku Besar"],["saldo","⚖️ Neraca Saldo"],["laporan","🧾 Laporan Keuangan"],["ai","🤖 Analis AI"],["presentasi","🎞️ Presentasi"]];
var rp=function(n){return (n<0?"-":"")+"Rp "+Math.abs(Math.round(n)).toLocaleString("id-ID")};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function tipe(a){a=a.toLowerCase();
 if(/^(kas|bank|piutang|persediaan|peralatan|perlengkapan|kendaraan|gedung)/.test(a))return "Aset";
 if(/^(utang|hutang)/.test(a))return "Kewajiban";
 if(/^(modal|prive)/.test(a))return "Modal";
 if(/^(pendapatan|penjualan)/.test(a))return "Pendapatan";
 if(/^(beban|hpp|biaya)/.test(a))return "Beban";
 return "Aset"}
function dn(t){return t==="Aset"||t==="Beban"}
var DEMO=[["2026-08-01","Setoran modal awal","Kas","Modal Pemilik",50000000],["2026-08-03","Beli peralatan","Peralatan","Kas",12000000],["2026-08-05","Beli persediaan kredit","Persediaan","Utang Usaha",8000000],["2026-08-10","Penjualan tunai","Kas","Pendapatan Penjualan",9500000],["2026-08-15","Bayar gaji","Beban Gaji","Kas",3000000],["2026-08-20","Bayar sewa","Beban Sewa","Kas",2000000],["2026-08-28","Bayar listrik","Beban Listrik","Kas",450000],["2026-09-02","Penjualan kredit","Piutang Usaha","Pendapatan Penjualan",11000000],["2026-09-09","Penjualan tunai","Kas","Pendapatan Penjualan",10500000],["2026-09-15","Bayar gaji","Beban Gaji","Kas",3000000],["2026-09-20","Bayar sewa","Beban Sewa","Kas",2000000],["2026-09-25","Bayar listrik","Beban Listrik","Kas",480000],["2026-09-30","Bayar utang usaha","Utang Usaha","Kas",4000000],["2026-10-04","Penjualan tunai","Kas","Pendapatan Penjualan",13000000],["2026-10-12","Terima pelunasan piutang","Kas","Piutang Usaha",6000000],["2026-10-15","Bayar gaji","Beban Gaji","Kas",3000000],["2026-10-20","Bayar sewa","Beban Sewa","Kas",2000000],["2026-10-27","Bayar listrik","Beban Listrik","Kas",4800000]].map(function(r){return {d:r[0],k:r[1],deb:r[2],kre:r[3],amt:r[4]}});
function calc(){var acc={},t={Aset:0,Kewajiban:0,Modal:0,Pendapatan:0,Beban:0},mo={};
 S.e.forEach(function(e){[[e.deb,1],[e.kre,-1]].forEach(function(p){var a=acc[p[0]]||(acc[p[0]]={n:p[0],ty:tipe(p[0]),D:0,C:0});if(p[1]>0)a.D+=e.amt;else a.C+=e.amt});
  var m=e.d.slice(0,7);mo[m]=mo[m]||{p:0,b:0};
  if(tipe(e.kre)==="Pendapatan")mo[m].p+=e.amt;if(tipe(e.deb)==="Pendapatan")mo[m].p-=e.amt;
  if(tipe(e.deb)==="Beban")mo[m].b+=e.amt;if(tipe(e.kre)==="Beban")mo[m].b-=e.amt});
 Object.keys(acc).forEach(function(k){var a=acc[k];a.s=dn(a.ty)?a.D-a.C:a.C-a.D;t[a.ty]+=a.s});
 var lancar=0;Object.keys(acc).forEach(function(k){if(/^(kas|bank|piutang|persediaan)/i.test(k))lancar+=acc[k].s});
 var laba=t.Pendapatan-t.Beban;
 return {acc:acc,t:t,mo:mo,laba:laba,lancar:lancar,ekuitas:t.Modal+laba}}
function anomalies(){var a=S.e.map(function(e){return e.amt});if(a.length<4)return [];
 var mu=a.reduce(function(x,y){return x+y},0)/a.length,sd=Math.sqrt(a.reduce(function(x,y){return x+(y-mu)*(y-mu)},0)/a.length)||1,out=[],seen={};
 S.e.forEach(function(e,i){var why=[],z=(e.amt-mu)/sd;if(Math.abs(z)>2)why.push("nominal tidak wajar (Z-score "+z.toFixed(1)+")");
  var key=e.d+e.k+e.amt;if(seen[key])why.push("kemungkinan duplikat");seen[key]=1;
  if(e.deb===e.kre)why.push("akun debit dan kredit sama");
  if(why.length)out.push({i:i,e:e,why:why.join(", ")})});
 // anomali per akun beban: lonjakan > 3x rata-rata akun yang sama
 var by={};S.e.forEach(function(e,i){if(tipe(e.deb)==="Beban"){(by[e.deb]=by[e.deb]||[]).push(i)}});
 Object.keys(by).forEach(function(k){var ix=by[k];if(ix.length<3)return;var avg=ix.reduce(function(s,i){return s+S.e[i].amt},0)/ix.length;
  ix.forEach(function(i){if(S.e[i].amt>avg*2&&!out.some(function(o){return o.i===i}))out.push({i:i,e:S.e[i],why:k+" jauh di atas rata-rata akunnya ("+rp(avg)+")"})})});
 return out}
function forecast(c){var ks=Object.keys(c.mo).sort();if(ks.length<2)return null;
 var y=ks.map(function(k){return c.mo[k].p-c.mo[k].b}),n=y.length,sx=0,sy=0,sxy=0,sxx=0;
 y.forEach(function(v,i){sx+=i;sy+=v;sxy+=i*v;sxx+=i*i});var d=n*sxx-sx*sx||1,b=(n*sxy-sx*sy)/d,a=(sy-b*sx)/n;
 return {v:a+b*n,slope:b}}
function insights(c){var o=[],pend=c.t.Pendapatan;
 if(!S.e.length)return o;
 if(!isFinite(c.t.Aset-(c.t.Kewajiban+c.ekuitas))||Math.abs(c.t.Aset-(c.t.Kewajiban+c.ekuitas))>1)o.push(["n","Persamaan akuntansi tidak seimbang. Periksa jurnal."]);
 else o.push(["","Persamaan akuntansi seimbang: Aset "+rp(c.t.Aset)+" = Kewajiban "+rp(c.t.Kewajiban)+" + Ekuitas "+rp(c.ekuitas)+"."]);
 if(pend>0){var nm=c.laba/pend*100;o.push([nm<10?"w":"","Margin laba bersih "+nm.toFixed(1)+"%. "+(nm<10?"Margin tipis, tinjau beban terbesar.":"Margin sehat.")])}
 if(c.t.Kewajiban>0){var cr=c.lancar/c.t.Kewajiban;o.push([cr<1?"n":"","Rasio lancar "+cr.toFixed(2)+". "+(cr<1?"Aset lancar tidak cukup menutup utang jangka pendek.":"Likuiditas aman (di atas 1).")])}
 var bb=Object.values(c.acc).filter(function(a){return a.ty==="Beban"}).sort(function(a,b){return b.s-a.s})[0];
 if(bb&&c.t.Beban>0)o.push(["","Beban terbesar: "+bb.n+" ("+rp(bb.s)+", "+(bb.s/c.t.Beban*100).toFixed(0)+"% dari total beban)."]);
 var f=forecast(c);if(f)o.push([f.v<0?"n":"","Prakiraan laba bulan depan sekitar "+rp(f.v)+" (tren "+(f.slope>=0?"naik":"turun")+" "+rp(Math.abs(f.slope))+" per bulan)."]);
 anomalies().forEach(function(x){o.push(["w","Transaksi janggal: \""+x.e.k+"\" "+rp(x.e.amt)+" pada "+x.e.d+" – "+x.why+"."])});
 return o}
function answer(q){var c=calc(),s=q.toLowerCase();if(!S.e.length)return "Belum ada data. Muat data contoh atau unggah CSV dulu.";
 if(/laba|untung|rugi/.test(s))return "Laba bersih: "+rp(c.laba)+" (pendapatan "+rp(c.t.Pendapatan)+" dikurangi beban "+rp(c.t.Beban)+").";
 if(/kas/.test(s)){var k=c.acc["Kas"];return k?"Saldo kas saat ini "+rp(k.s)+". Kas masuk "+rp(k.D)+", kas keluar "+rp(k.C)+".":"Tidak ada akun Kas."}
 if(/rasio|likuid/.test(s))return "Rasio lancar "+(c.t.Kewajiban?(c.lancar/c.t.Kewajiban).toFixed(2):"tak terhingga")+". Margin laba "+(c.t.Pendapatan?(c.laba/c.t.Pendapatan*100).toFixed(1):0)+"%. Utang terhadap ekuitas "+(c.ekuitas?(c.t.Kewajiban/c.ekuitas).toFixed(2):"-")+".";
 if(/anomali|aneh|janggal/.test(s)){var a=anomalies();return a.length?a.map(function(x){return "• "+x.e.k+" "+rp(x.e.amt)+" ("+x.why+")"}).join("\n"):"Tidak ada transaksi janggal terdeteksi."}
 if(/prediksi|forecast|depan/.test(s)){var f=forecast(c);return f?"Prakiraan laba bulan depan sekitar "+rp(f.v)+".":"Butuh data minimal 2 bulan."}
 if(/beban|biaya/.test(s)){return Object.values(c.acc).filter(function(a){return a.ty==="Beban"}).sort(function(a,b){return b.s-a.s}).map(function(a){return "• "+a.n+": "+rp(a.s)}).join("\n")}
 if(/saran|rekomendasi/.test(s)){return insights(c).map(function(i){return "• "+i[1]}).join("\n")}
 return "Coba tanya: laba bersih, saldo kas, rasio keuangan, transaksi janggal, prediksi, beban, atau saran."}
function tbl(h,rows,rc){return '<div class="scroll"><table><tr>'+h.map(function(x,i){return '<th'+(rc&&rc.indexOf(i)>=0?' class="r"':'')+'>'+x+'</th>'}).join("")+'</tr>'+rows.join("")+'</table></div>'}
function view(){var c=calc(),v=document.getElementById("view"),h="";
 if(!S.e.length&&S.tab!=="jurnal"&&S.tab!=="presentasi"){v.innerHTML='<div class="card empty"><h2>Belum ada transaksi</h2>Klik “Muat data contoh”, unggah file CSV, atau catat jurnal di tab Jurnal Umum.</div>';return}
